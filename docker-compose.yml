services:
  postgres:
    image: postgres:16-alpine
    container_name: acaku-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acaku_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - acaku-postgres-data:/var/lib/postgresql/data
      - ./backend/database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  acaku-postgres-data:
